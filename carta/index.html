<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">

<title>Carta para imprimir (30 oct)</title>
<style>:root{--bg:#f4f6f3;--card:#fff;--ink:#1d2421;--muted:#5f6b66;--line:#dde3df;--accent:#1f7a62;--warn:#a23b2a}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#121715;--card:#1a211e;--ink:#e7ece9;--muted:#9aa8a2;--line:#2b3531;--accent:#5cc6a5;--warn:#ef8a78;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#121715;--card:#1a211e;--ink:#e7ece9;--muted:#9aa8a2;--line:#2b3531;--accent:#5cc6a5;--warn:#ef8a78;color-scheme:dark}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:640px;margin:0 auto;padding:24px 16px 48px}h1{font-size:1.4rem;margin:0 0 8px}h2{font-size:1rem;margin:28px 0 8px;color:var(--muted);font-weight:600}
p{color:var(--muted);margin:0 0 12px}.err{color:var(--warn)}a{color:var(--accent)}
ul{list-style:none;margin:0;padding:0;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
li a{display:block;padding:14px 16px;border-top:1px solid var(--line);text-decoration:none;color:var(--ink)}li:first-child a{border-top:0}li a:active{background:var(--line)}</style>
</head>
<body>
<main>
<h1>Carta para imprimir (30 oct)</h1>
<p id="estado" role="status">Cargando…</p>
<p><a href="../paginas/">Todas las páginas</a></p>
</main>
<script src="../comun/cargar.js" data-pagina="carta"></script>
</body>
</html>
